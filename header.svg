<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rakesh Samanta - Full-Stack MERN Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0E1A3A"/>
      <stop offset="1" stop-color="#0A2E34"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38B2AC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38B2AC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38B2AC"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38B2AC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38B2AC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38B2AC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#38B2AC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38B2AC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#38B2AC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <circle cx="180" cy="60" r="200" fill="url(#g1)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="220" r="220" fill="url(#g2)">
      <animate attributeName="cx" values="820;680;820" dur="16s" repeatCount="indefinite"/>
    </circle>

    <text x="70" y="175" font-size="110" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#38B2AC" fill-opacity="0.10" text-anchor="middle">&lt;/&gt;</text>
    <text x="935" y="175" font-size="110" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#3B82F6" fill-opacity="0.12" text-anchor="middle">{ }</text>

    <circle cx="34" cy="30" r="5" fill="#FF5F56"/>
    <circle cx="54" cy="30" r="5" fill="#FFBD2E"/>
    <circle cx="74" cy="30" r="5" fill="#27C93F"/>
    <text x="96" y="35" font-size="13" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#64748B">~/portfolio  $ whoami</text>
    <rect x="258" y="23" width="8" height="15" fill="#38B2AC">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <text x="500" y="128" font-size="62" font-weight="700" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="url(#title)">Rakesh Samanta</text>
      <text x="500" y="168" font-size="22" letter-spacing="4" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#E2E8F0">FULL-STACK MERN DEVELOPER</text>
      <text x="500" y="205" font-size="16" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#38B2AC">React  ·  Node.js  ·  Express  ·  MongoDB</text>
    </g>

    <rect x="0" y="-4" width="1000" height="3" fill="url(#scan)">
      <animate attributeName="y" values="-4;260" dur="5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="256" width="1000" height="4" fill="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="17.5" stroke="url(#edge)" stroke-opacity="0.5"/>
</svg>
